services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./instances/proxy-11234/.env
    environment:
      PROXY_ADMIN_ALLOW_HOST: "1"
      FALLBACK_CONFIG_PATH: /app/instances/proxy-11234/fallback.json
    ports:
      - "127.0.0.1:11234:11234"
    volumes:
      - ./instances/proxy-11234:/app/instances/proxy-11234
